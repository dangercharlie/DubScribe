name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v0.5

jobs:
  build:
    runs-on: macos-latest # Uses an Apple Silicon Mac hosted by GitHub
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App with Xcode
        run: |
          xcodebuild -project DubScribe.xcodeproj -scheme DubScribe -configuration Release clean build -derivedDataPath build

      - name: Install Packaging Tool
        run: |
          brew install create-dmg

      - name: Package into DMG and ZIP
        run: |
          mkdir -p release_dmg/staging
          cp -R build/Build/Products/Release/DubScribe.app release_dmg/staging/
          create-dmg \
            --volname "DubScribe" \
            --window-pos 200 120 \
            --window-size 620 360 \
            --icon-size 128 \
            --icon "DubScribe.app" 160 165 \
            --hide-extension "DubScribe.app" \
            --app-drop-link 460 165 \
            --no-internet-enable \
            "release_dmg/DubScribe-macOS-arm64.dmg" \
            "release_dmg/staging"
          cd release_dmg/staging
          zip -ry ../DubScribe-macOS-arm64.zip DubScribe.app

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Build the release as a draft rather than publishing on the tag.
          #
          # Every release up to 0.6.4 went live the moment the tag was pushed.
          # That is fine for a one-line change, but it means the first person to
          # learn whether the artifact actually runs is a user: CI proves the code
          # compiles, and nothing more. A draft builds and attaches the same
          # artifacts, then waits for a human to download the DMG, launch it, and
          # publish deliberately.
          #
          # Also note the tag is never checked against MARKETING_VERSION, so a
          # mismatched tag builds whatever happens to be in the tree.
          draft: true
          files: |
            release_dmg/DubScribe-macOS-arm64.dmg
            release_dmg/DubScribe-macOS-arm64.zip
